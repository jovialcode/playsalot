name: playsalot-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-playsalot}
      POSTGRES_USER: ${POSTGRES_USER:-playsalot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playsalot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../apps/game-server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  game-server:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.game-server
    environment:
      PORT: 2567
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-playsalot}:${POSTGRES_PASSWORD:-playsalot}@postgres:5432/${POSTGRES_DB:-playsalot}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-do-not-use-in-production}
    ports:
      - "${GAME_SERVER_PORT:-2567}:2567"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:2567}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:2567}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      game-server:
        condition: service_started

volumes:
  postgres-data:
